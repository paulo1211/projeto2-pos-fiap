apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paulo1211/projeto2-pos-fiap.git
    targetRevision: main
    path: gitops/apps/analytics-service
  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # KEDA scales this Deployment (including to 0 replicas when the SQS queue
  # is empty), which would otherwise fight selfHeal: true reverting it back
  # to the static replica count committed in deployment.yaml on every sync.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: analytics-service
      jsonPointers:
        - /spec/replicas
