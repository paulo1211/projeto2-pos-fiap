apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.1.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/gitops/observability/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/paulo1211/projeto2-pos-fiap.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs do prometheus-operator excedem o limite de tamanho da annotation
      # last-applied-configuration do client-side apply.
      - ServerSideApply=true
