# Loki em modo SingleBinary — centralização e indexação de todos os logs dos
# contêineres do cluster. Os logs chegam pelo endpoint OTLP nativo do Loki
# (/otlp), enviados pelo OTel Collector gateway.

deploymentMode: SingleBinary
fullnameOverride: loki

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    # Obrigatório para ingestão OTLP (atributos viram structured metadata).
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 72h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  # Sem EBS CSI driver no cluster: emptyDir (dados efêmeros, ok para demo).
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Modo SingleBinary: os componentes do modo SimpleScalable ficam zerados.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Extras desnecessários para um único nó (o chunks-cache sozinho pede vários
# GB de memória por padrão).
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
