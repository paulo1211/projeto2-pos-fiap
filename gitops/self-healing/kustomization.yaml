apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Self-healing (Etapa 3): runbook que recebe o webhook do Grafana Alerting e
# faz rollout restart do deployment em falha. Sem "namespace:" aqui: o
# Deployment fica em observability e o Role/RoleBinding em togglemaster.
resources:
  - rbac.yaml
  - deployment.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: togglemaster-ecosystem
    includeSelectors: false

# O hash no nome do ConfigMap faz o Deployment reiniciar quando o script muda.
configMapGenerator:
  - name: self-healing-runbook
    namespace: observability
    files:
      - runbook.py
