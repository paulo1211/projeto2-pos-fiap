apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing
  namespace: observability
  labels:
    app: self-healing
    app.kubernetes.io/name: self-healing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-healing
  template:
    metadata:
      labels:
        app: self-healing
        app.kubernetes.io/name: self-healing
    spec:
      serviceAccountName: self-healing
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runbook
          # Só biblioteca padrão do Python: o script vem do ConfigMap, sem
          # imagem própria para construir.
          image: docker.io/library/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/app/runbook.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TARGET_NAMESPACE
              value: togglemaster
            - name: ALLOWED_DEPLOYMENTS
              value: auth-service
            - name: COOLDOWN_SECONDS
              value: "300"
            # Mesmo Secret dos contact points do Grafana
            # (terraform/scripts/sync-alerting-secrets.sh).
            - name: SELF_HEALING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alerting-secrets
                  key: SELF_HEALING_TOKEN
                  optional: true
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alerting-secrets
                  key: DISCORD_WEBHOOK_URL
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runbook
              mountPath: /app
              readOnly: true
      volumes:
        - name: runbook
          configMap:
            name: self-healing-runbook
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing
  namespace: observability
  labels:
    app: self-healing
spec:
  selector:
    app: self-healing
  ports:
    - name: http
      port: 8080
      targetPort: http
