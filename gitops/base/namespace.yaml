apiVersion: v1
kind: Namespace
metadata:
  name: togglemaster
  labels:
    app.kubernetes.io/name: togglemaster
    app.kubernetes.io/part-of: togglemaster-ecosystem
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: togglemaster-workload
  namespace: togglemaster
  # AWS Academy (use_lab_role = true no Terraform): sem IRSA, os pods usam a
  # LabRole do nó via IMDS, então a ServiceAccount fica sem annotation.
  # Em conta AWS comum (use_lab_role = false), adicione:
  #   annotations:
  #     eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/togglemaster-workload-irsa-role"
