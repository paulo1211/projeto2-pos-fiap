apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-config
  namespace: togglemaster
  labels:
    app.kubernetes.io/name: togglemaster
data:
  AWS_REGION: "us-east-1"
  AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
  AUTH_SERVICE_PORT: "8001"
  FLAG_SERVICE_PORT: "8002"
  TARGETING_SERVICE_PORT: "8003"
  EVALUATION_SERVICE_PORT: "8004"
  ANALYTICS_SERVICE_PORT: "8005"
  AUTH_SERVICE_URL: "http://auth-service.togglemaster.svc.cluster.local:8001"
  FLAG_SERVICE_URL: "http://flag-service.togglemaster.svc.cluster.local:8002"
  TARGETING_SERVICE_URL: "http://targeting-service.togglemaster.svc.cluster.local:8003"
  # OpenTelemetry: os SDKs enviam traces/métricas por OTLP/HTTP ao gateway
  # (que roteia para New Relic, Prometheus e Loki). O SDK acrescenta
  # /v1/traces e /v1/metrics ao endpoint.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-gateway.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
