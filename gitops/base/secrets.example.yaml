# Reference only — intentionally NOT listed in kustomization.yaml and NOT
# synced by ArgoCD. Real values never go into git.
#
# Terraform generates the DB/Redis/queue values (see terraform/main.tf +
# modules/rds's Secrets Manager entries); terraform/scripts/sync-secrets.sh
# reads them and applies the real Secret object directly to the cluster
# with `kubectl apply` after every `terraform apply`. If this manifest were
# part of the GitOps sync, ArgoCD's auto-sync would revert the real secret
# back to whatever placeholder is committed here on every reconciliation.
apiVersion: v1
kind: Secret
metadata:
  name: togglemaster-secrets
  namespace: togglemaster
type: Opaque
stringData:
  AUTH_DATABASE_URL: "postgres://user:password@host:5432/auth_db?sslmode=require"
  FLAG_DATABASE_URL: "postgres://user:password@host:5432/flags_db?sslmode=require"
  TARGETING_DATABASE_URL: "postgres://user:password@host:5432/targeting_db?sslmode=require"
  REDIS_URL: "redis://host:6379"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/<account-id>/evaluation-analytics"
  MASTER_KEY: "changeme"
  SERVICE_API_KEY: "changeme"
