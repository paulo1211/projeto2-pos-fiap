name: _ci-go-service

on:
  workflow_call:
    inputs:
      service_path:
        required: true
        type: string
      service_name:
        required: true
        type: string
      go_version:
        required: false
        type: string
        default: "1.21"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v -cover

  lint:
    name: Linter/Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ inputs.service_path }}
          args: --timeout=5m

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: SCA - Trivy filesystem scan (dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service_path }}
          severity: CRITICAL
          exit-code: "1"
          format: table

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: SAST - gosec
        continue-on-error: true
        working-directory: ${{ inputs.service_path }}
        run: gosec -severity high -confidence high ./...

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      registry: ${{ steps.registry.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t ${{ inputs.service_name }}:${{ steps.tag.outputs.tag }} ${{ inputs.service_path }}

      - name: Container Scan - Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.service_name }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          exit-code: "1"
          format: table

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Computed ourselves via STS rather than read from
      # steps.ecr-login.outputs.registry: that output proved unreliable
      # within this same job (empty in one step even on runs where a later
      # step's use of the identical expression clearly had it, since the
      # image did land in the right ECR repo) — likely a bug/race in
      # aws-actions/amazon-ecr-login@v2 itself. This is deterministic.
      - name: Compute ECR registry
        id: registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "value=${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag & push image to ECR
        run: |
          IMAGE="${{ steps.registry.outputs.value }}/${{ inputs.service_name }}:${{ steps.tag.outputs.tag }}"
          docker tag ${{ inputs.service_name }}:${{ steps.tag.outputs.tag }} "$IMAGE"
          docker push "$IMAGE"

  update-gitops:
    name: Update GitOps manifest
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump image tag & push (with retry)
        env:
          NEW_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
          REGISTRY: ${{ needs.docker-build-push.outputs.registry }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILE="gitops/apps/${{ inputs.service_name }}/deployment.yaml"

          # Re-fetch, re-apply the sed and re-commit on every attempt (rather
          # than committing once and rebasing that commit) so a concurrent
          # run touching the same image: line can never produce a merge
          # conflict — each attempt just overwrites the line again on top of
          # whatever is latest on origin/main.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            sed -i -E "s#^(\s*image:\s*).*#\1${REGISTRY}/${{ inputs.service_name }}:${NEW_TAG}#" "$FILE"
            git diff "$FILE"
            git add "$FILE"
            git commit -m "chore(gitops): deploy ${{ inputs.service_name }} ${NEW_TAG} [skip ci]" || { echo "no changes to commit"; exit 0; }

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push rejeitado (tentativa $attempt/5), tentando de novo..."
            sleep $((RANDOM % 5 + 1))
          done

          echo "Falha ao dar push após 5 tentativas" >&2
          exit 1
