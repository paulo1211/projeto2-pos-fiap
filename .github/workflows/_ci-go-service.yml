name: _ci-go-service

on:
  workflow_call:
    inputs:
      service_path:
        required: true
        type: string
      service_name:
        required: true
        type: string
      go_version:
        required: false
        type: string
        default: "1.21"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v -cover

  lint:
    name: Linter/Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ inputs.service_path }}
          args: --timeout=5m

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: SCA - Trivy filesystem scan (dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service_path }}
          severity: CRITICAL
          exit-code: "1"
          format: table

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: SAST - gosec
        continue-on-error: true
        working-directory: ${{ inputs.service_path }}
        run: gosec -severity high -confidence high ./...

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t ${{ inputs.service_name }}:${{ steps.tag.outputs.tag }} ${{ inputs.service_path }}

      - name: Container Scan - Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.service_name }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          exit-code: "1"
          format: table

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag & push image to ECR
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ inputs.service_name }}:${{ steps.tag.outputs.tag }}"
          docker tag ${{ inputs.service_name }}:${{ steps.tag.outputs.tag }} "$IMAGE"
          docker push "$IMAGE"

  update-gitops:
    name: Update GitOps manifest
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump image tag in gitops manifest
        env:
          NEW_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
          REGISTRY: ${{ needs.docker-build-push.outputs.registry }}
        run: |
          set -euo pipefail
          FILE="gitops/apps/${{ inputs.service_name }}/deployment.yaml"
          sed -i -E "s#^(\s*image:\s*).*#\1${REGISTRY}/${{ inputs.service_name }}:${NEW_TAG}#" "$FILE"
          git diff "$FILE"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/${{ inputs.service_name }}/deployment.yaml
          git commit -m "chore(gitops): deploy ${{ inputs.service_name }} ${{ needs.docker-build-push.outputs.image_tag }} [skip ci]" || echo "no changes to commit"
          git push
