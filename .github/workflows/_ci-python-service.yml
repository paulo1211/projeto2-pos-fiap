name: _ci-python-service

on:
  workflow_call:
    inputs:
      service_path:
        required: true
        type: string
      service_name:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: "3.10"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check
        run: python -m py_compile *.py

      - name: pytest
        run: |
          if compgen -G "test_*.py" > /dev/null || compgen -G "*_test.py" > /dev/null || [ -d tests ]; then
            pytest -v
          else
            echo "No unit tests found, skipping."
          fi

  lint:
    name: Linter/Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install linters
        run: pip install flake8 pylint

      - name: flake8
        continue-on-error: true
        run: flake8 --max-line-length=120 .

      - name: pylint
        run: pylint --fail-under=6 $(git ls-files '*.py') || true

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: SCA - Trivy filesystem scan (dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service_path }}
          severity: CRITICAL
          exit-code: "1"
          format: table

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install bandit
        run: pip install bandit

      - name: SAST - bandit
        continue-on-error: true
        working-directory: ${{ inputs.service_path }}
        run: bandit -r . -ll -iii

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      registry: ${{ steps.registry.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t ${{ inputs.service_name }}:${{ steps.tag.outputs.tag }} ${{ inputs.service_path }}

      - name: Container Scan - Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.service_name }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          exit-code: "1"
          format: table
          trivyignores: .github/trivy/python-baseimage.trivyignore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          # This action masks the resolved AWS account ID by default
          # (add-mask). That's why every registry value we ever derived in
          # this job — the login action's own output, and our own "computed
          # via STS" step — worked fine for same-job use (the push always
          # landed in the right ECR repo) but came back empty once read from
          # a *different* job via needs.docker-build-push.outputs.registry:
          # GitHub Actions scrubs masked values when they cross a job
          # boundary through outputs. The account ID is already public in
          # this repo (baked into every gitops/apps/*/deployment.yaml image:
          # line), so there's nothing to protect by masking it here.
          mask-aws-account-id: "false"

      # Computed ourselves via STS rather than read from
      # steps.ecr-login.outputs.registry, which had the same masking problem.
      - name: Compute ECR registry
        id: registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "value=${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag & push image to ECR
        run: |
          IMAGE="${{ steps.registry.outputs.value }}/${{ inputs.service_name }}:${{ steps.tag.outputs.tag }}"
          docker tag ${{ inputs.service_name }}:${{ steps.tag.outputs.tag }} "$IMAGE"
          docker push "$IMAGE"

  update-gitops:
    name: Update GitOps manifest
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump image tag & push (with retry)
        env:
          NEW_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
          REGISTRY: ${{ needs.docker-build-push.outputs.registry }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILE="gitops/apps/${{ inputs.service_name }}/deployment.yaml"

          # Re-fetch, re-apply the sed and re-commit on every attempt (rather
          # than committing once and rebasing that commit) so a concurrent
          # run touching the same image: line can never produce a merge
          # conflict — each attempt just overwrites the line again on top of
          # whatever is latest on origin/main.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            sed -i -E "s#^(\s*image:\s*).*#\1${REGISTRY}/${{ inputs.service_name }}:${NEW_TAG}#" "$FILE"
            git diff "$FILE"
            git add "$FILE"
            git commit -m "chore(gitops): deploy ${{ inputs.service_name }} ${NEW_TAG} [skip ci]" || { echo "no changes to commit"; exit 0; }

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push rejeitado (tentativa $attempt/5), tentando de novo..."
            sleep $((RANDOM % 5 + 1))
          done

          echo "Falha ao dar push após 5 tentativas" >&2
          exit 1
