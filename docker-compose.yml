services:
  analytics-service:
    image: analytics-service:0.1
    restart: always
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - AWS_SQS_URL=http://localhost:4566/queue/auth-analytics
      - AWS_DYNAMODB_TABLE=ToggleMasterAnalytics
      - AWS_REGION=us-east-1
    networks:
      - tech-challenger-2-network
  auth-service:
    image: auth-service:0.1
    restart: always
    environment:
      - DATABASE_URL=postgres://postgres:postgres-secret@172.19.0.100:5432,172.19.0.101:5432/auth_db?sslmode=disable&target_session_attrs=any
      - PORT=8001
      - MASTER_KEY=supersecretkey
    networks:
      - tech-challenger-2-network
    depends_on:
      - postgres-primary
    deploy:
      replicas: 2


  evaluation-service:
    image: evaluation-service:0.1
    restart: always
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - REDIS_URL=redis://tech-challenger-2-redis-1:6379
      - FLAG_SERVICE_URL=http://flag-service:8002
      - TARGETING_SERVICE_URL=http://targeting-service:8003
      - SERVICE_API_KEY=SUA_CHAVE_DE_SERVICO
      - AWS_SQS_URL=http://localhost:4566/queue/auth-analytics
      - AWS_REGION=us-east-1 
    networks:
      - tech-challenger-2-network
    depends_on:
      - redis
      - flag-service
      - targeting-service


  flag-service:
    image: flag-service:0.1
    restart: always
    environment:
      - DATABASE_URL=postgres://postgres:postgres-secret@172.19.0.100:5432,172.19.0.101:5432/flags_db?target_session_attrs=any
      - PORT=8002
      - AUTH_SERVICE_URL=http://auth-service:8001
    networks:
      - tech-challenger-2-network
    depends_on:
      - postgres-primary
    deploy:
      replicas: 2


  targeting-service:
    image: targeting-service:0.1
    restart: always
    environment:
      - DATABASE_URL=postgres://postgres:postgres-secret@172.19.0.100:5432,172.19.0.101:5432/targeting_db?target_session_attrs=any
      - PORT=8003
      - AUTH_SERVICE_URL=http://auth-service:8001
    networks:
      - tech-challenger-2-network
    depends_on:
      - postgres-primary
    deploy:
      replicas: 2
    

  dynamodb-local:
    image: "amazon/dynamodb-local:latest"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    volumes:
      - "./databases/dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    networks:
      - tech-challenger-2-network


  postgres-primary:
    image: bitnami/postgresql:latest
    container_name: postgres-primary
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres-secret
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres-secret
      - POSTGRESQL_DATABASE=auth_db
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
    volumes:
      - postgres-primary-data:/bitnami/postgresql
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/auth_db.sql
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/flags_db.sql
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/targeting_db.sql
    ports:
      - "5432:5432"
    networks:
      tech-challenger-2-network:
        ipv4_address: 172.19.0.100

  postgres-replica:
    image: bitnami/postgresql:latest
    container_name: postgres-replica
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres-secret
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres-secret
      - POSTGRESQL_MASTER_HOST=172.19.0.100
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
    volumes:
      - postgres-replica-data:/bitnami/postgresql
    ports:
      - "5433:5432"
    depends_on:
      - postgres-primary
    networks:
      tech-challenger-2-network:
        ipv4_address: 172.19.0.101


  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - ./databases/redis-data:/data 
    networks:
      - tech-challenger-2-network

  nginx-lb:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - flag-service
      - targeting-service
    networks:
      - tech-challenger-2-network

networks:
  tech-challenger-2-network:
    ipam:
      config:
        - subnet: 172.19.0.0/16

volumes:
  postgres-primary-data:
  postgres-replica-data: